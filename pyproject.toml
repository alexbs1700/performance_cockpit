[project]
name = "performance-cockpit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexbs17", email = "alexbs1700@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "garminconnect>=0.3.17",
    "google-cloud-storage>=3.15.1",
]

[project.scripts]
performance-cockpit = "performance_cockpit:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import where a cell first needs something, not at the top of the file.
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
